# CodeBuild project infogen-image: environment ARM_CONTAINER, image aws/codebuild/amazonlinux-aarch64-standard:3.0, privileged mode on.
version: 0.2
env:
  variables:
    REPO: infogen
phases:
  pre_build:
    commands:
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
      - TAG=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual} | cut -c1-7)
  build:
    commands:
      # Build under the commit tag only; `latest` is not touched until the smoke test passes.
      - docker build --build-arg GIT_SHA=$TAG -t $REGISTRY/$REPO:$TAG .
      - |
        docker run --rm --entrypoint bash $REGISTRY/$REPO:$TAG -c "uname -m && ffmpeg -version | head -1 && firefox --version && claude --version && fc-list | grep -qi montserrat && cd /tmp && python3 -m infogen 2>&1 | head -1 && python3 -c 'from infogen import render; render.run([{\"props\": {\"type\": \"bar_chart\", \"width\": 1280, \"height\": 720, \"fps\": 30, \"seconds\": 1, \"title\": \"Smoke\", \"items\": [{\"label\": \"A\", \"value\": 3}, {\"label\": \"B\", \"value\": 5}]}, \"out\": \"/tmp/t.mp4\"}, {\"props\": {\"type\": \"map\", \"width\": 640, \"height\": 360, \"fps\": 30, \"seconds\": 0.5, \"highlight\": [\"France\"]}, \"out\": \"/tmp/m.mp4\"}])' && ffprobe -v error -show_entries stream=codec_name,nb_frames -of csv=p=0 /tmp/t.mp4 && ffprobe -v error -show_entries stream=codec_name,nb_frames -of csv=p=0 /tmp/m.mp4"
      # Reached only if every command above succeeded (CodeBuild stops a phase at its first failure).
      - docker push $REGISTRY/$REPO:$TAG
      - docker tag $REGISTRY/$REPO:$TAG $REGISTRY/$REPO:latest
      - docker push $REGISTRY/$REPO:latest
      - printf '{"image":"%s/%s:%s"}' $REGISTRY $REPO $TAG > image.json
artifacts:
  files: [image.json]
